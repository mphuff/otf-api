name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-pypi-dists:
    name: Build Python package & OpenAPI schema

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit }}
          # Versioneer only generates correct versions with a full fetch
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.3"
          python-version: 3.11
          activate-environment: true
          enable-cache: true

      - name: Install python packages
        run: uv sync --no-default-groups

      - name: Build a binary wheel and a source tarball
        run: uv build

      - name: Generate OpenAPI schema
        run: uv run python scripts/generate_openapi.py

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dists
          path: "./dist"

      - name: Upload OpenAPI YAML
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./schema/openapi.yaml
          asset_name: openapi.yaml
          asset_content_type: application/x-yaml

      - name: Upload OpenAPI JSON
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./schema/openapi.json
          asset_name: openapi.json
          asset_content_type: application/json

  publish-pypi-dists:
    name: Publish to PyPI
    environment:
      name: release
      url: https://pypi.org/p/otf-api
    needs: [build-pypi-dists]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: pypi-dists
          path: "./dist"

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
